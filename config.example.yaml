# codavox configuration. Copy to /etc/codavox/config.yaml and edit.
#
# Every setting here is also a command-line flag. A flag overrides this file,
# and this file overrides the built-in default. See docs/configuration.md.
#
# code-id and code-content do not read this file: they run on every catalog
# compile and stay a single symlink read.

# Shared paths, used by publish, deploy, and deploy-server.
staging:  /etc/puppetlabs/code-staging
state:    /opt/puppetlabs/codavox/state
ssldir:   /etc/puppetlabs/puppet/ssl
certname: puppet.example.com

# r10k, used by deploy and deploy-server.
r10k:        /opt/puppetlabs/puppet/bin/r10k
r10k_config: /etc/puppetlabs/r10k/r10k.yaml

publish:
  listen: ":8150"
  allow_roles: [openvox_compiler]
  # Compilers authorized by certname instead, for certificates issued before
  # codavox existed and so carrying no pp_role. Either check admits, so an
  # estate can move to roles one re-issued certificate at a time.
  allow_certnames: []
  # Refuse revoked certificates, read from <ssldir>/crl.pem — the same file
  # every other Puppet service checks. Takes Puppet's own values: chain (the
  # default), leaf, or false. Set it to false only if your estate distributes
  # no CRL; a revoked compiler then keeps its access until its cert expires.
  certificate_revocation: chain

deploy_server:
  listen: ":8170"
  api_token: /etc/codavox/api.token
  secret:    /etc/codavox/webhook.secret
  history: 100

agent:
  publisher: https://puppet.example.com:8150
  interval:  30s
  keep:      3
  min_age:   2h
  # Remove environments the publisher no longer serves. Off by default;
  # deletion is destructive, so opt in. Needs r10k purge_levels set too.
  prune_environments: false

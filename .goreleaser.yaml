---
version: 2

project_name: codavox

before:
  hooks:
    - go mod tidy

builds:
  - id: codavox
    main: ./cmd/codavox
    binary: codavox
    env:
      # No cgo, so the binary carries no runtime dependency and the same
      # artifact installs on every glibc and musl distro in the test estate.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      # arm64 is not secondary: Parallels VMs and Docker on Apple silicon are
      # both aarch64, so it is the primary local test target.
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: codavox
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: codavox
    package_name: codavox
    vendor: Michael Harp
    homepage: https://github.com/miharp/codavox
    maintainer: Michael Harp <mike@mikeharp.com>
    license: Apache-2.0
    description: |-
      Versioned code distribution for OpenVox compilers.

      Implements OpenVox Server's versioned-code-service contract, serving a
      stable code_id per environment and file content addressed by that id.
    formats:
      - rpm
      - deb

    # /usr/bin, not /opt/puppetlabs/bin: that directory is owned by the
    # openvox-agent package and shipping into it invites file conflicts on
    # upgrade. versioned-code.conf takes an absolute path, so co-locating
    # buys nothing.
    bindir: /usr/bin

    contents:
      # OpenVox Server passes only positional arguments to code-id-command,
      # so it cannot invoke `codavox code-id`. The binary dispatches on
      # argv[0], so these symlinks give each setting a path to point at.
      # A shell wrapper would work too, but would add a fork to a path that
      # runs on every catalog compile.
      - src: /usr/bin/codavox
        dst: /usr/bin/codavox-code-id
        type: symlink
      - src: /usr/bin/codavox
        dst: /usr/bin/codavox-code-content
        type: symlink

      - dst: /opt/puppetlabs/codavox/versions
        type: dir
        file_info:
          mode: 0755

      # The daemons are config-file driven, and every systemd unit below refers
      # to this path, so the package has to put something there — an install
      # that leaves the file absent gives `codavox agent` nothing to read and it
      # exits telling the operator to pass --publisher.
      #
      # config|noreplace, so an upgrade never overwrites a site's settings: the
      # new version lands beside it as .rpmnew / .dpkg-dist for the operator to
      # merge. Every value is commented out, so the shipped file is inert and
      # the built-in defaults still apply until something is uncommented.
      - src: packaging/config.yaml
        dst: /etc/codavox/config.yaml
        type: config|noreplace
        file_info:
          mode: 0640

      # The fully populated example, for reference alongside the live file.
      - src: config.example.yaml
        dst: /usr/share/doc/codavox/config.example.yaml

      # systemd units for the three daemons. They are config-file driven
      # (/etc/codavox/config.yaml), so a node runs `codavox agent`, `publish`,
      # or `deploy-server` by enabling the matching unit — one binary, one
      # config, role chosen by which units are enabled.
      - src: packaging/systemd/codavox-agent.service
        dst: /usr/lib/systemd/system/codavox-agent.service
      - src: packaging/systemd/codavox-publish.service
        dst: /usr/lib/systemd/system/codavox-publish.service
      - src: packaging/systemd/codavox-deploy-server.service
        dst: /usr/lib/systemd/system/codavox-deploy-server.service

    # daemon-reload on install so the units are visible; nothing is enabled or
    # started, so installing the package changes no configuration.
    scripts:
      postinstall: packaging/scripts/postinstall.sh

    rpm:
      group: System Environment/Base
    deb:
      fields:
        Bugs: https://github.com/miharp/codavox/issues

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # GitHub's native release-note generation produces a clean "What's Changed"
  # list from the merged pull requests — with links and contributors — rather
  # than a flat, alphabetical dump of every commit. sort, filters, and groups do
  # not apply here; GitHub controls the format. Categorize by PR label with a
  # .github/release.yml if that is ever wanted.
  use: github-native

---
# Self-contained end-to-end integration test: stands up a real two-node OpenVox
# topology (primary CA + publisher, compiler wired to codavox), provisions it
# with plain shell — no ovadm — and exercises every feature against real
# puppetserver processes.
#
# It installs openvox-server and boots two JVMs, so it is too heavy to gate every
# pull request. It runs on push to main, on demand, and on the pull requests it
# is the only check for — see the paths filter below.
name: Integration

on:
  push:
    branches: [main]
  workflow_dispatch:
  # These paths have no other verification. A change to a workflow, to the
  # packaging, or to the harness itself passes every Go test and static gate
  # while being completely unexercised, so the first time it runs is after it
  # has merged — which is how a goreleaser-action bump nearly reached a tag
  # unverified, and how an agent bug reached main. Depending on someone
  # remembering to dispatch this by hand is not a control.
  #
  # Not internal/** wholesale: the harness would then gate most pull requests,
  # and CONTRIBUTING.md already asks for a local run when a change touches TLS
  # or the agent's HTTP client. The deploy path and the agent are listed,
  # though. Their behaviour against a real r10k and a real puppetserver — a
  # module deploy, a hung r10k, an oversized artifact, a deleted branch — is
  # what this harness exercises and no Go test can, and the first time those
  # ran against anything real was in a lab after the release had shipped.
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.goreleaser.yaml'
      - 'packaging/**'
      - 'test/integration/**'
      - 'internal/deploy/**'
      - 'internal/deployserver/**'
      - 'internal/webhook/**'
      - 'internal/agent/**'

# One run per ref: superseded pushes to a pull request should not queue up
# 30-minute jobs behind each other.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: End-to-end (self-contained, no ovadm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # install-only: run.sh invokes goreleaser itself to build the HEAD package.
      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Run the end-to-end harness
        run: ./test/integration/run.sh

---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # v8 is the first action line that installs golangci-lint v2. The v6
      # action pins v1.x, which cannot parse a `version: "2"` config and
      # refuses to target a module newer than the Go it was built with.
      #
      # The version is pinned rather than tracking latest so a new golangci
      # release cannot break CI on an unrelated pull request.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # -race matters here: the agent will poll and swap concurrently with
      # puppetserver invoking code-id, so data races are a live risk as the
      # codebase grows.
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  fuzz:
    name: Fuzz the artifact extractor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Extraction is the only place codavox parses untrusted bytes: the
      # artifact is unpacked before its code_id can be verified, so a malformed
      # or hostile one reaches this code first. A panic here crash-loops the
      # agent on every compiler at once.
      #
      # A short run per PR is the point — it re-checks the seed corpus and
      # explores a little further each time, rather than trying to be an
      # exhaustive search. This caught a real crash on two-character entry
      # names, which ordinary control repos contain.
      - name: Fuzz ExtractArchive
        run: go test -run '^$' -fuzz FuzzExtractArchive -fuzztime 60s ./internal/seal/

      # A crash leaves its input in testdata/fuzz; keep it so the failure can be
      # reproduced locally and committed as a regression seed.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: internal/seal/testdata/fuzz/
          retention-days: 14

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The integration harness and the package's postinstall script are shell,
      # and both run somewhere a failure is expensive to debug: inside a
      # container topology, or on an operator's machine mid-install.
      - name: Lint shell scripts
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 shellcheck --external-sources

  spelling:
    name: cspell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cspell.json is a project convention — unfamiliar-but-correct terms go in
      # the dictionary rather than being reworded — which only holds if
      # something enforces it.
      #
      # Scoped to markdown, matching markdownlint: the convention is about
      # documentation prose. Running it over Go source would drown real typos in
      # package names and identifiers.
      - name: Check spelling
        run: npx --yes cspell@8 --no-progress '**/*.md'

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # codavox ships rpm and deb to production compilers and terminates TLS,
      # so a known vulnerability in the toolchain or a dependency matters even
      # with a dependency list this short. govulncheck reports only what is
      # actually reachable from this code.
      - name: Scan for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Run for visibility, not as a gate: shared runners are too noisy for a
      # hard threshold. The numbers land in the log, and running them keeps the
      # benchmarks and the acceptance harness from silently failing to compile.
      - name: Per-deploy operation benchmarks
        run: go test -run '^$' -bench . -benchmem ./internal/seal/ ./internal/layout/

      - name: Deploy phase timings
        run: CODAVOX_ACCEPTANCE=1 go test -run TestDeployPhaseTimings -v ./test/acceptance/

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 is not optional: Parallels VMs and Docker on Apple silicon
          # are both aarch64, so this is the primary local test target.
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o codavox-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/codavox

      - uses: actions/upload-artifact@v4
        with:
          name: codavox-${{ matrix.goos }}-${{ matrix.goarch }}
          path: codavox-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

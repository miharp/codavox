---
name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets the packaging path be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the version and changelog from tag history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # A tag that fails its own tests is worse than a missing release, and a
      # tag push cannot be un-published cleanly.
      - name: Verify before releasing
        run: |
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test -race ./...

      # The install-by-URL instructions hardcode a version, and it silently
      # drifted once already: v0.4.0 shipped while the docs still said 0.3.0. A
      # release whose own docs install a different version is worse than a
      # failed tag, so this checks them rather than trusting the release notes
      # to mention it. Only installation.md carries the URL form now; the README
      # installs from the repository, which needs no version.
      # Skipped on workflow_dispatch, which has no tag to compare against.
      - name: Documented install version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          rc=0
          for f in docs/installation.md; do
            # `|| true` so a file with no VERSION line does not trip pipefail; the
            # empty check below reports that case with a message worth reading.
            found=$(grep -oE '^VERSION=[0-9]+\.[0-9]+\.[0-9]+' "$f" | cut -d= -f2 | sort -u || true)
            if [ -z "$found" ]; then
              echo "$f has no VERSION= install line; did the instructions move?" >&2
              rc=1
            elif [ "$found" != "$tag" ]; then
              echo "$f documents $(echo "$found" | tr '\n' ' ')but this tag is $tag" >&2
              rc=1
            fi
          done
          exit "$rc"

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          # A manual dispatch has no tag to release, so build a snapshot and
          # keep the artifacts rather than failing.
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.tar.gz
          retention-days: 14
